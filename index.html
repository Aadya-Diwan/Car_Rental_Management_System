<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Rental System</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI';
    background: #f1f5f9;
}

.navbar {
    background: #0f172a;
    color: white;
    padding: 15px;
    text-align: center;
    font-size: 22px;
    font-weight: bold;
}

.container {
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 20px;
    padding: 20px;
}

.sidebar {
    background: white;
    padding: 20px;
    border-radius: 12px;
}

.main {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.cars {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 15px;
}

.card {
    background: white;
    padding: 15px;
    border-radius: 12px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
}

.car.selected {
    border: 2px solid #2563eb;
}

input {
    width: 100%;
    padding: 10px;
    margin: 6px 0;
    border-radius: 6px;
    border: 1px solid #ccc;
}

button {
    width: 100%;
    padding: 10px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

.msg {
    font-weight: bold;
    margin-top: 8px;
}
</style>
</head>

<body>

<div class="navbar">🚗 Car Rental Management System</div>

<div class="container">

<!-- LEFT SIDE -->
<div class="sidebar">

<h3>Customer Details</h3>

<input id="name" placeholder="Full Name">
<input id="email" placeholder="Email">
<input id="phone" placeholder="Phone">
<input id="license" placeholder="License Number">

<button onclick="createCustomer()">Continue</button>
<p id="customerMsg" class="msg"></p>

<hr>

<h3>Booking</h3>

<p><b>Selected Car ID:</b> <span id="selectedCar">None</span></p>

<input type="date" id="start">
<input type="date" id="end">

<button onclick="calculatePrice()">Calculate Price</button>
<p id="price" class="msg"></p>

<button onclick="book()">🚗 Book Now</button>
<p id="bookingMsg" class="msg"></p>

</div>

<!-- RIGHT SIDE -->
<div class="main">
<h2>Available Cars</h2>
<div class="cars" id="cars"></div>
</div>

</div>

<script>

// GLOBAL STATE
let currentCustomerId = localStorage.getItem("customerId") || null;
let selectedCarId = null;
let selectedPrice = 0;

// LOAD CARS
window.onload = loadCars;

function loadCars() {
    fetch("http://localhost:5000/cars")
    .then(res => res.json())
    .then(data => {
        const container = document.getElementById("cars");
        container.innerHTML = "";

        data.forEach(car => {
            container.innerHTML += `
                <div class="card car" id="car-${car.car_id}">
                    <h3>${car.brand} ${car.model}</h3>
                    <p>ID: ${car.car_id}</p>
                    <p>₹${car.price_per_day}/day</p>
                    <button onclick="selectCar(${car.car_id}, ${car.price_per_day})">
                        Select
                    </button>
                </div>
            `;
        });
    });
}

// CREATE CUSTOMER
function createCustomer() {
    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const phone = document.getElementById("phone").value;
    const license = document.getElementById("license").value;

    if (!name || !email || !phone || !license) {
        document.getElementById("customerMsg").innerText = "Fill all fields ❌";
        return;
    }

    fetch("http://localhost:5000/customers", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            name,
            email,
            phone,
            license_number: license
        })
    })
    .then(res => res.json())
    .then(data => {
        console.log("Customer Response:", data);

        if (!data.customer_id) {
            document.getElementById("customerMsg").innerText =
                "Error creating customer ❌";
            return;
        }

        currentCustomerId = data.customer_id;
        localStorage.setItem("customerId", currentCustomerId);

        document.getElementById("customerMsg").innerText =
            "Customer created ✅ ID: " + currentCustomerId;
    });
}

// SELECT CAR
function selectCar(id, price) {
    selectedCarId = id;
    selectedPrice = price;

    document.getElementById("selectedCar").innerText = id;

    document.querySelectorAll(".car").forEach(c => c.classList.remove("selected"));
    document.getElementById("car-" + id).classList.add("selected");
}

// CALCULATE PRICE
function calculatePrice() {
    if (!selectedCarId) {
        document.getElementById("price").innerText = "Select car first ❌";
        return;
    }

    const start = new Date(document.getElementById("start").value);
    const end = new Date(document.getElementById("end").value);

    const days = Math.ceil((end - start) / (1000 * 60 * 60 * 24));

    if (days <= 0) {
        document.getElementById("price").innerText = "Invalid dates ❌";
        return;
    }

    const total = days * selectedPrice;

    document.getElementById("price").innerText =
        `Total: ₹${total} (${days} days)`;
}

// BOOK CAR
function book() {
    console.log("Customer ID:", currentCustomerId);

    if (!currentCustomerId) {
        document.getElementById("bookingMsg").innerText =
            "Customer not created ❌";
        return;
    }

    if (!selectedCarId) {
        document.getElementById("bookingMsg").innerText =
            "Select a car ❌";
        return;
    }

    const start = document.getElementById("start").value;
    const end = document.getElementById("end").value;

    if (!start || !end) {
        document.getElementById("bookingMsg").innerText =
            "Select dates ❌";
        return;
    }

    fetch("http://localhost:5000/rentals", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            customer_id: currentCustomerId,
            car_id: selectedCarId,
            start_date: start,
            end_date: end
        })
    })
    .then(res => res.text())
    .then(msg => {
        document.getElementById("bookingMsg").innerText = msg;

        // RESET UI
        selectedCarId = null;
        document.getElementById("selectedCar").innerText = "None";
        document.getElementById("price").innerText = "";

        loadCars();
    });
}

</script>

</body>
</html>
